<!DOCTYPE html>
<html lang="id">
<head>
  <!-- Pengaturan karakter dan tampilan responsif  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pencatat Keuangan Harian</title>

  <!-- Menghubungkan Bootstrap dan CSS sendiri -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
<!--  -->
  <!-- Bagian navigasi dan tanggal -->
  <header>
    <nav class="navbar navbar-dark bg-uang">
      <div class="container">
        <span class="navbar-brand">Catatan Uang Harian</span>
        <span id="teksTanggal"></span>
      </div>
    </nav>
  </header>

  <!-- Bagian utama aplikasi -->
  <main class="container py-4">
    <div class="row g-4">

      <!-- Form untuk menambahkan catatan -->
      <section class="col-12 col-lg-4">
        <div class="card kartu">
          <div class="card-body">
            <h2 class="h5">Tambah Catatan</h2>

            <form id="formCatatan" novalidate>
              <label for="inputKeterangan" class="form-label">Keterangan</label>
              <input type="text" id="inputKeterangan" class="form-control" placeholder="Contoh: Makan siang">
              <div id="pesanKeterangan" class="invalid-feedback"></div>

              <label for="inputJumlah" class="form-label mt-3">Jumlah (Rp)</label>
              <input type="number" id="inputJumlah" class="form-control" placeholder="Contoh: 15000">
              <div id="pesanJumlah" class="invalid-feedback"></div>

              <label for="inputJenis" class="form-label mt-3">Jenis</label>
              <select id="inputJenis" class="form-select">
                <option value="masuk">Pemasukan</option>
                <option value="keluar">Pengeluaran</option>
              </select>

              <button type="submit" class="btn btn-utama w-100 mt-3">
                Simpan Catatan
              </button>
            </form>
          </div>
        </div>
      </section>

      <!-- Ringkasan pemasukan, pengeluaran, dan saldo -->
      <section class="col-12 col-lg-8">
        <div class="row g-3 mb-3">

          <div class="col-12 col-md-4">
            <div class="card kartu">
              <div class="card-body">
                Pemasukan
                <div id="totalMasuk" class="angka teks-masuk">Rp 0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="card kartu">
              <div class="card-body">
                Pengeluaran
                <div id="totalKeluar" class="angka teks-keluar">Rp 0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <div class="card kartu">
              <div class="card-body">
                Saldo
                <div id="saldo" class="angka">Rp 0</div>
              </div>
            </div>
          </div>

        </div>

        <!-- Pesan kondisi keuangan -->
        <div id="alertSaldo" class="alert" role="alert"></div>

        <!-- Tabel riwayat dan filter transaksi -->
        <div class="card kartu">
          <div class="card-body">
            <h2 class="h5">Riwayat Catatan</h2>

            <select id="filterJenis" class="form-select mb-3" aria-label="Filter jenis transaksi">
              <option value="semua">Semua</option>
              <option value="masuk">Pemasukan</option>
              <option value="keluar">Pengeluaran</option>
            </select>

            <div class="table-responsive">
              <table class="table">
                <thead>
                  <tr>
                    <th>Tanggal</th>
                    <th>Keterangan</th>
                    <th>Jenis</th>
                    <th class="text-end">Jumlah</th>
                    <th>Aksi</th>
                  </tr>
                </thead>
                <tbody id="isiTabel"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Bagian penutup halaman -->
  <footer class="text-center small py-3">
    Proyek Mini UTS · Sistem Informasi
  </footer>

  <!-- Menghubungkan Bootstrap JavaScript dan program sendiri -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
